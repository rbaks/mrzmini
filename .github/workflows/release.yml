name: Release to PyPI

# Publishes on a pushed version tag (e.g. v0.1.0) using PyPI Trusted Publishing
# (OIDC) — no API tokens stored. Configure the trusted publisher on PyPI first:
#   project: mrzmini, owner/repo: rbaks/mrzmini,
#   workflow: release.yml, environment: pypi
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Checked before publish: a version PyPI accepted cannot be uploaded again
      # once the CHANGELOG is fixed.
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Section body between "## [<version>]" and the next "## [" heading
          # (or the link definitions at the end of the file).
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::No '## [$version]' section in CHANGELOG.md"
            exit 1
          fi
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build sdist and wheel
        run: uv build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: notes
          # Outside the checkout, so that uv build does not put it in the sdist
          path: ${{ runner.temp }}/notes.md

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    # Runs only after PyPI accepted the upload, so a GitHub release never
    # advertises a version that isn't installable.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to create the release
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: notes
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "mrzmini ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --verify-tag
